- name: Prepare EC2 instances
  hosts: all
  become: true
  gather_facts: false

  pre_tasks:
    - name: Wait for SSH and Python readiness
      ansible.builtin.wait_for_connection:
        delay: 5
        sleep: 5
        timeout: 300

    - name: Gather host facts
      ansible.builtin.setup:

  roles:
    - docker

  tasks:
    - name: Install Node Exporter on scrape targets
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present
      when:
        - deployment_managed_inventory | default(false)
        - "'monitoring' not in group_names"

    - name: Start Node Exporter on scrape targets
      ansible.builtin.service:
        name: prometheus-node-exporter
        state: started
        enabled: true
      when:
        - deployment_managed_inventory | default(false)
        - "'monitoring' not in group_names"
