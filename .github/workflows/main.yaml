name: main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov - ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: terraform
            directory: infra
            framework: terraform

          - name: ansible
            directory: ansible
            framework: ansible

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ matrix.directory }}
          framework: ${{ matrix.framework }}
          quiet: true
          output_format: junitxml
          output_file_path: checkov-${{ matrix.name }}.xml

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkov-${{ matrix.name }}-results
          path: checkov-${{ matrix.name }}.xml
          if-no-files-found: warn

  shellcheck:
    name: ShellCheck - Bash
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check Bash scripts
        shell: bash
        run: |
          cp example.env .env
          shellcheck --external-sources --format=checkstyle deploy.sh scripts/*.sh | tee shellcheck.xml

      - name: Upload ShellCheck report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shellcheck-results
          path: shellcheck.xml
          if-no-files-found: warn

  powershell:
    name: PSScriptAnalyzer - PowerShell
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer `
            -Scope CurrentUser `
            -Force `
            -Repository PSGallery

      - name: Analyze PowerShell scripts
        shell: pwsh
        run: |
          $scripts = @(
            Get-Item .\deploy.ps1
            Get-ChildItem .\scripts -Filter *.ps1 -Recurse
          )

          $issues = @(
            foreach ($script in $scripts) {
              Invoke-ScriptAnalyzer `
                -Path $script.FullName `
                -Severity Error,Warning
            }
          )

          if ($issues.Count -eq 0) {
            $report = "PSScriptAnalyzer found no errors or warnings in $($scripts.Count) scripts."
          } else {
            $report = $issues | Format-List RuleName, Severity, ScriptName, Line, Message | Out-String -Width 240
          }
          $report | Tee-Object -FilePath psscriptanalyzer.txt

          if ($issues.Count -gt 0) {
            throw "PSScriptAnalyzer found $($issues.Count) issues."
          }

      - name: Upload PSScriptAnalyzer report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: psscriptanalyzer-results
          path: psscriptanalyzer.txt
          if-no-files-found: warn

  python:
    name: Python - Ruff and Bandit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis tools
        run: python -m pip install ruff bandit -r requirements.txt

      - name: Test deployment
        run: python -m unittest discover -s tests

      - name: Run Ruff
        shell: bash
        run: ruff check main.py utils/ config/ 2>&1 | tee ruff.txt

      - name: Run Bandit
        if: ${{ !cancelled() }}
        shell: bash
        run: bandit -r main.py utils/ config/ 2>&1 | tee bandit.txt

      - name: Upload Ruff report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ruff-results
          path: ruff.txt
          if-no-files-found: warn

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-results
          path: bandit.txt
          if-no-files-found: error

